<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MaBallet</title>

  <link rel="stylesheet" href="/estilo.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    .dash-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 10%;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .kpi-card {
      background: rgba(255,255,255,0.85);
      border: 1px solid #f3c6d3;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(209,106,138,0.1);
      border-top: 4px solid #d16a8a;
    }

    .kpi-label {
      font-size: 12px;
      color: #9e6b6b;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .kpi-valor {
      font-size: 2rem;
      font-weight: 700;
      color: #b76e79;
      font-family: Georgia, serif;
      line-height: 1.2;
    }

    .graficos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .grafico-card {
      background: rgba(255,255,255,0.85);
      border: 1px solid #f3c6d3;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 8px 32px rgba(209,106,138,0.1);
    }

    .grafico-titulo {
      font-size: 16px;
      font-weight: bold;
      color: #b76e79;
      margin-bottom: 20px;
      font-family: Georgia, serif;
    }

    canvas {
      max-height: 320px;
    }
  </style>
</head>
<body>

  <header>
    <h1>MaBallet</h1>
    <nav>
      <a href="../public/index.html">Home</a>
      <a href="../public/login.html">Login</a>
      <a href="dashboard.html" class="ativo">Dashboard</a>
    </nav>
  </header>

  <div class="dash-main">

    <h2>Painel de Indicadores</h2>

    <div class="kpi-grid">

      <div class="kpi-card">
        <p class="kpi-label">Total de respostas</p>
        <p class="kpi-valor" id="totalRespostas">0</p>
      </div>

      <div class="kpi-card">
        <p class="kpi-label">Perfil mais comum</p>
        <p class="kpi-valor" id="perfilMaisComum">Carregando...</p>
      </div>

    </div>

    <div class="graficos-grid">

      <div class="grafico-card">
        <p class="grafico-titulo">Distribuição de Perfis</p>
        <canvas id="grafico-perfis"></canvas>
      </div>

    </div>

  </div>

  <footer>
    <p>Ballet Dom Quixote • Projeto Individual 2026 • SPTECH</p>
  </footer>

  <script>
    var CORES = [
      "#d16a8a",
      "#b76e79",
      "#e8a0bf",
      "#f3c6d3"
    ];

    function nomePerfil(letra) {
      if (letra == "A") return "Espírito Poético 🌸";
      if (letra == "B") return "Técnico Dedicado 🎯";
      if (letra == "C") return "Alma Livre ✨";
      if (letra == "D") return "Estrela em Formação ⭐";
      return letra;
    }

    function carregarDashboard() {
  fetch("/quiz/dashboard")
    .then(function (resposta) {
      return resposta.json();
    })
    .then(function (dados) {
      console.log(dados);

      var listaPerfis = dados.graficos.perfis;

      var labels = [];
      var valores = [];

      var totalRespostas = dados.kpis.total_quizzes || 0;
      var maiorValor = 0;
      var perfilMaisComum = "Nenhum";

      for (var i = 0; i < listaPerfis.length; i++) {
        var perfil = listaPerfis[i].perfil;
        var total = Number(listaPerfis[i].quantidade);

        labels.push(nomePerfil(perfil));
        valores.push(total);

        if (total > maiorValor) {
          maiorValor = total;
          perfilMaisComum = nomePerfil(perfil);
        }
      }

      document.getElementById("totalRespostas").innerHTML = totalRespostas;
      document.getElementById("perfilMaisComum").innerHTML = perfilMaisComum;

      criarGrafico(labels, valores);
    })
    .catch(function (erro) {
      console.log("Erro ao carregar dashboard:", erro);
    });
}

    function criarGrafico(labels, valores) {
      new Chart(document.getElementById("grafico-perfis"), {
        type: "doughnut",
        data: {
          labels: labels,
          datasets: [{
            data: valores,
            backgroundColor: CORES,
            borderWidth: 2,
            borderColor: "#ffffff"
          }]
        },
        options: {
          cutout: "55%",
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
      });
    }

    carregarDashboard();
  </script>

</body>
</html>
