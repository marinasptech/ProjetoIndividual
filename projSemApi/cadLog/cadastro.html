<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <header>
    <h1>MaBallet</h1>
    <nav>
      <a href="../home/home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="cadastro.html" class="ativo">Cadastro</a>
    </nav>
  </header>

  <div class="pagina">
    <div class="card">
      <h2>Criar conta</h2>
      <p class="subtitulo">Preencha os dados abaixo para se cadastrar</p>

      <div class="alerta erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
      <div class="alerta sucesso" id="cardSucesso">
        <span id="mensagem_sucesso"></span>
      </div>

      <div class="campo">
        <label>Nome completo</label>
        <input type="text" id="idNome" placeholder="Seu nome" />
      </div>

      <div class="campo">
        <label>CPF</label>
        <input type="text" id="idCpf" maxlength="11" placeholder="Somente números" />
      </div>

      <div class="campo">
        <label>E-mail</label>
        <input type="text" id="idEmail" placeholder="meuemail@provedor.com" />
      </div>

      <div class="linha-dupla">
        <div class="campo">
          <label>Senha</label>
          <input type="password" id="idSenha" placeholder="******" />
        </div>
        <div class="campo">
          <label>Confirmar senha</label>
          <input type="password" id="idConfirmaSenha" placeholder="******" />
        </div>
      </div>

      <button type="button" class="botao" onclick="cadastrar()">Cadastrar</button>

      <p class="rodape-card">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

 <footer>
    <p>Ballet Dom Quixote • Projeto Individual 2026 • SPTECH</p>
</footer>

  <script>

    function cadastrar() {

      let nome = idNome.value;
      let cpf  = idCpf.value;
      let email = idEmail.value;
      let senha = idSenha.value;
      let confirma = idConfirmaSenha.value;

      // Campos em branco
      if (nome === "" || cpf === "" || email === "" || senha === "" || confirma === "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos.";
        return false;
      }

      // Nome
      if (nome.length <= 1) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Nome deve ter mais de 1 caractere.";
        return false;
      }

      // CPF
      if (cpf.length != 11) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "CPF deve ter 11 dígitos.";
        return false;
      }

      // Email
      if (!email.includes("@") || !email.includes(".")) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "E-mail inválido.";
        return false;
      }

      // Senha
      if (senha.length <= 6) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Senha deve ter mais de 6 caracteres.";
        return false;
      }

      // Confirmação de senha
      if (senha !== confirma) {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "As senhas não coincidem.";
        return false;
      }

    /*  // Envia para a API
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          nomeServer:  nome,
          cpfServer:   cpf,
          emailServer: email,
          senhaServer: senha
        })
      }).then(
      function(resposta) {
*/
        localStorage.setItem("emailCadastrado", email);
        localStorage.setItem("senhaCadastrada", senha);

        alert("Cadastro realizado com sucesso!");
        window.location.href = "login.html";
        return false;
    }
  </script>

</body>
</html>
