<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>

  <header>

  <div class="pagina">

      <div class="campo">
        <label>E-mail</label>
        <input type="email" id="idEmail" placeholder="meuemail@provedor.com" />
      </div>

      <div class="campo">
        <label>Senha</label>
        <input type="password" id="idSenha" placeholder="******" />
      </div>

      <button type="button" class="botao" onclick="entrar()">Entrar</button>

      <p class="tentativas" id="tentativas"></p>

      <p class="rodape-card">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>
<footer>
    <p>Ballet Dom Quixote • Projeto Individual 2026 • SPTECH</p>
</footer>

      let email = idEmail.value;
      let senha = idSenha.value;

      // Campos em branco
      if (email === "" || senha === "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos.";
        return false;
      }

        if (resposta.ok) {

            sessionStorage.CPF_USUARIO   = json.cpf;
*/

            mensagem_sucesso.innerHTML = "Login realizado! Redirecionando...";

            setTimeout(function() {
              window.location.href = "./dashboard/cards.html";
            }, 1500);
         // });

        } else {

          erros.push("erro");

          if (erros.length >= 3) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Você excedeu o número de tentativas. Acesso bloqueado!";
            tentativas.innerHTML = "";
            return false;
          }

          let restantes = 3 - erros.length;
          cardErro.style.display = "block";
          mensagem_erro.innerHTML = "E-mail ou senha incorretos.";
          tentativas.innerHTML = "Tentativas restantes: " + restantes;
